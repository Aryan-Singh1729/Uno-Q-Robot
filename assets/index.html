<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Optimus Live Mission View</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">UNO Q AUTONOMY</p><h1>Optimus Live Mission View</h1></div>
      <button id="stop" type="button">EMERGENCY STOP</button>
    </header>
    <section class="camera-card">
      <canvas id="camera" width="640" height="480"></canvas>
      <div id="placeholder">Waiting for the USB camera…</div>
    </section>
    <section class="status-card">
      <span id="state" class="badge">starting</span>
      <span id="detail">The robot app is starting.</span>
    </section>
  </main>
  <script src="libs/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
